plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

def targetJavaVersion = Integer.parseInt(project.target_java_version)
def javaVersionString = "JAVA_" + targetJavaVersion.toString()

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def interactiveRunPath = "run/interactive"
def interactiveServerRunPath = interactiveRunPath + "/server"
def interactiveClientRunPath = interactiveRunPath + "/client"

def gametestRunPath = "run/gametest"
def gametestServerRunPath = gametestRunPath + "/server"
def gametestClientRunPath = gametestRunPath + "/client"


loom {
	splitEnvironmentSourceSets()
}

sourceSets {
	gametest {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
	}
	gametestClient {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
		compileClasspath += client.compileClasspath
		runtimeClasspath += client.runtimeClasspath
		compileClasspath += gametest.compileClasspath
		runtimeClasspath += gametest.runtimeClasspath
	}
}

loom {
	mods {
		"dimensional-inventories" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"dimensional-inventories-gametest" {
			sourceSet sourceSets.gametest
			sourceSet sourceSets.gametestClient
		}
	}

	runs {
		server {
			runDir(interactiveServerRunPath)
		}

		client {
			runDir(interactiveClientRunPath)
		}

		gametestServer {
			server()
			name "Game Test Server"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=report/junit.xml"
			runDir(gametestServerRunPath)
			source sourceSets.gametest
		}

		gametestClient {
			client()
			name "Game Test Client"
			//vmArg "-Dfabric-api.gametest.structures.output-dir=${file("src/gametest/resources/data/dimensional-inventories-gametest/gametest/structures")}"
			runDir(gametestClientRunPath)
			source sourceSets.gametestClient
		}
	}
}

tasks.register("cleanGametestServer") {
	group = "gametest"
	doLast {
		delete(gametestServerRunPath)
	}
}

tasks.register("acceptGametestServerEula") {
	group = "gametest"
	mustRunAfter(cleanGametestServer)
	doLast {
		mkdir(gametestServerRunPath)
		new File(gametestServerRunPath, "eula.txt").text = "eula=true"
	}
}

tasks.register("acceptInteractiveServerEula") {
	doLast {
		mkdir(interactiveServerRunPath)
		new File(interactiveServerRunPath, "eula.txt").text = "eula=true"
	}
}

tasks.register("gametestJar", Jar) {
	group = "build"
	from sourceSets.gametest.output
	archiveClassifier = "gametest"
}

tasks.register("gametestSourcesJar", Jar) {
	group = "build"
	from sourceSets.gametest.allSource
	archiveClassifier = "gametest-sources"
}

tasks.register("creativeDimensionDatapackZip", Zip) {
    group = "build"
    from "./src/main/datapacks/example"
    archiveBaseName = "creative-dimension"
    archiveVersion = minecraft_version

    inputs.property("minecraft_version", minecraft_version)
    inputs.property("data_pack_min_format", data_pack_min_format)
    inputs.property("data_pack_max_format", data_pack_max_format)
	filteringCharset = "UTF-8"

	expand "data_pack_min_format": data_pack_min_format,
			"data_pack_max_format": data_pack_max_format
}

tasks.build {
	dependsOn(gametestJar)
	dependsOn(gametestSourcesJar)
	dependsOn(creativeDimensionDatapackZip)
}

tasks.javadoc {
	source += sourceSets.client.allJava
	source += sourceSets.gametest.allJava
	source += sourceSets.test.allJava
    classpath += sourceSets.gametest.compileClasspath
}

runClient.configure {
	dependsOn(build)
}

runServer.configure {
	dependsOn(build)
	dependsOn(acceptInteractiveServerEula)
}

runGametestClient.configure {
	dependsOn(build)
}

runGametestServer.configure {
	dependsOn(build)
	dependsOn(cleanGametestServer, acceptGametestServerEula)
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Google Gson for JSON parsing and writing
	api "com.google.code.gson:gson:${project.gson_version}"

	// Apache Commons IO to move entire directories
	implementation "commons-io:commons-io:${project.apache_commons_io_version}"

	gametestImplementation sourceSets.main.output
	gametestClientImplementation sourceSets.main.output
	gametestClientImplementation sourceSets.client.output
	gametestClientImplementation sourceSets.gametest.output

    // Exclude transitive dependencies to avoid duplicate Fabric Loader classes
    gametestImplementation "com.github.gnembon:fabric-carpet:${project.carpet_version}" transitive false
}

tasks.withType(ProcessResources).configureEach {
	inputs.property("java_version", target_java_version)
	inputs.property("version", project.version)
	inputs.property("minecraft_version", minecraft_version)
	inputs.property "target_minecraft_version", target_minecraft_version
	inputs.property("loader_version", loader_version)
	inputs.property("carpet_version", carpet_version)
	filteringCharset = "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "java_version": target_java_version,
				"version": project.version,
				"minecraft_version": minecraft_version,
				"target_minecraft_version": target_minecraft_version,
                "loader_version": loader_version,
                "carpet_version": carpet_version
	}

	filesMatching("*.mixins.json") {
		expand "java_version": javaVersionString
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"
	if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
		it.options.release.set(targetJavaVersion)
	}
}

tasks.withType(Jar).configureEach {
	if (!it.name.endsWith("sourcesJar"))
	{
		exclude("**/*.xcf")
	}
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	withJavadocJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = base.archivesName
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
